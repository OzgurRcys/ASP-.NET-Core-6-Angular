<div class="row">
  <div class="col-md-3"></div>
    <div class="col-md-6">
      <form [formGroup]="frm" (ngSubmit)="onSubmit(frm.value)">

     <div class="mb-3" >
        <label for="nameSurname" class="form-label">Ad Soyad</label>
        <input type="text" formControlName="nameSurname" class="form-control" id="nameSurname"  placeholder="Ad Soyad" [ngClass]="{'is-invalid': submitted && component.nameSurname.errors}">
        <div  class="form-text text-muted invalid-feedback" *ngIf="submitted && component.nameSurname.errors?.required" >Ad Soyad kısmını boş geçmeyiniz !</div>
        <div  class="form-text text-muted invalid-feedback" *ngIf="submitted && (component.nameSurname.errors?.maxlength || component.nameSurname.errors?.minlength)"> Lütfen 3 ile 50 karakterli bir Ad Soyad giriniz !</div>
     </div>

     <div class="mb-3" >
        <label for="username" class="form-label">Kullanıcı Adı</label>
        <input type="text" formControlName="username" class="form-control" id="username" [ngClass]="{'is-invalid': submitted && component.username.errors}"      placeholder="Kullanıcı Adı">
        <div  class="form-text text-muted invalid-feedback" *ngIf="submitted && component.username.errors?.required" >Kullanıcı Adı kısmını boş geçmeyiniz !</div>
     </div>

     <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" formControlName="email" class="form-control" id="email" aria-describedby="emailHelp" [ngClass]="{'is-invalid': submitted && component.email.errors}" placeholder="Email">
        <div  class="form-text text-muted invalid-feedback" *ngIf="submitted && component.email.errors?.required" >Email kısmını boş geçmeyiniz !</div>
        <div  class="form-text text-muted invalid-feedback" *ngIf="component.email.errors?.email" >Email kısmını kurallı bir biçimde giriniz !</div>
     </div>

     <div class="mb-3">
        <label for="password" class="form-label">Şifre</label>
        <input type="password" formControlName="password" class="form-control" id="password" placeholder="Şifre" [ngClass]="{'is-invalid': submitted && component.password.errors}">
     </div>

     <div class="mb-3">
        <label for="passwordConfirm" class="form-label">Şifre Tekrar</label>
        <input type="password" formControlName="passwordConfirm" class="form-control" id="passwordConfirm" placeholder="Şifre Tekrar" [ngClass]="{'is-invalid': submitted && component.passwordConfirm.errors}">
        <div class="form-text text-muted" *ngIf="submitted && frm.hasError('notSame')">Şifreler uyuşmuyor, lütfen kontrol ediniz !</div>
     </div>

     <button type="submit" class="btn btn-primary">Kayıt Ol</button>

    </form>
   </div>
  <div class="col-md-3"></div>
</div>
